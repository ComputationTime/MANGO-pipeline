# =============================================================================
# MANGO environment.
#
#   conda env create -f environment.yaml
#   conda activate mango
#
# Antigen embedders and analysis scorers with conflicting dependencies have
# their own minimal environments in envs/*.yaml. PyRosetta needs its own
# channel/license and is intentionally omitted here.
# =============================================================================
name: mango
channels:
  - conda-forge
  - bioconda
  - pytorch
dependencies:
  - python=3.11
  - pytorch>=2.0
  - numpy
  - pandas>=2.0
  - biopython>=1.81
  - matplotlib-base>=3.8
  - einops
  - pyyaml
  - seaborn
  - scipy
  - pip
  - pip:
      - fair-esm          # ESM2 antigen embeddings (auto-downloads weights)
      - ablang2==0.2.1    # weights are staged explicitly under artifacts/weights
      - transformers==4.57.2  # GPT2 head for the MANGO model
