# =============================================================================
# Full MANGO workflow environment.
# =============================================================================
# One environment that can drive Snakemake and the first milestone (fetch,
# process, one-hot + AbLang2 embedding, train, evaluate, predict, generate)
# without per-rule Conda environments. It also carries a few dependencies for
# deferred embedders so those implementations can be tested independently.
#
#   conda env create -f environment.yaml
#   conda activate mango
#   snakemake -s workflow/Snakefile --cores 8            # runs in this env
#
# (The per-rule envs in workflow/envs/*.yaml are the minimal, isolated
#  alternative used when you run Snakemake with --sdm conda. This file is the
#  batteries-included superset.)
#
# Note: pyrosetta (needed only for the PyRosetta_PRE antigen method, not built
# yet) is intentionally omitted -- it needs its own channel/license and conflicts
# with parts of this stack; install it in a separate env when that method lands.
name: mango
channels:
  - conda-forge
  - bioconda
  - pytorch
dependencies:
  - python=3.11
  - pytorch>=2.0
  - numpy
  - pandas>=2.0
  - biopython>=1.81
  - matplotlib-base>=3.8
  - einops
  - snakemake-minimal>=9,<10
  - pip
  - pip:
      - fair-esm          # ESM2 antigen embeddings (auto-downloads weights)
      - ablang2==0.2.1    # weights are staged explicitly under artifacts/weights
      - transformers==4.57.2  # GPT2 head for the MANGO model
