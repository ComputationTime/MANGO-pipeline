name: mango-embed-esm3
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.11
  # ESM 3.1.x still imports torchtext. Its final compatible release is paired
  # with PyTorch 2.3; qualify channels so Conda cannot substitute CPU builds.
  - pytorch=2.3.0
  - torchvision=0.18.0
  - torchtext=0.18.0
  - pytorch-cuda=12.1
  - numpy
  - pip
  - pip:
      # Biohub's ESM3 package. MUST stay isolated from fair-esm because both
      # own the top-level `esm` import. ESM 3.1.5 added getter-only special-token
      # properties that Transformers tries to set during tokenizer startup.
      # The preceding official 3.1.3 revision retains the compatible tokenizer.
      - esm @ git+https://github.com/evolutionaryscale/esm.git@1b3e08025b8fcae39e9c9fe70e1dcde97707ffcd
      - transformers==4.46.3
      # The GPU image enables HF_HUB_ENABLE_HF_TRANSFER globally. Keep its
      # accelerated downloader inside this model-specific environment so model
      # acquisition does not depend on packages installed elsewhere.
      - hf-transfer>=0.1.8,<0.2
