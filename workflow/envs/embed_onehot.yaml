name: mango-embed-onehot
channels:
  - pytorch
  - conda-forge
dependencies:
  - python=3.11
  # Pin the tensor serialization ABI to the training stack. An open lower
  # bound can resolve to a future CUDA/libtorch build even though this adapter
  # itself has no learned weights.
  - pytorch::pytorch=2.5.1
  - pytorch::cpuonly
  - numpy
