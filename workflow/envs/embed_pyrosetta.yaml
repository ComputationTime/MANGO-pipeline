name: mango-embed-pyrosetta
channels:
  - pytorch
  - conda-forge
dependencies:
  - python=3.11
  # PRE scoring is CPU-only; torch is used only to serialize the resulting
  # tensor. Pin the small CPU build instead of allowing Conda to select a newer
  # multi-gigabyte CUDA libtorch from conda-forge.
  - pytorch::pytorch=2.5.1
  - pytorch::cpuonly
  - numpy
  - pip
  - pip:
      # Official quarterly academic/non-commercial distribution. There is no
      # separate weight file: Rosetta's database ships inside this package.
      # The user remains responsible for licence eligibility/terms.
      - --find-links=https://west.rosettacommons.org/pyrosetta/quarterly/release
      - pyrosetta
