# Rapid, HER2-free pilot: eight final ESM2 models, one epoch per training stage.
experiment_root: artifacts/experiments/asd_her2_free_prototype_v1
cohort_dir: artifacts/experiments/asd_her2_free_prototype_v1/cohort
embedding_root: artifacts/experiments/asd_her2_free_prototype_v1
esm2_cache_dir: artifacts/experiments/asd_focal_comparison_v1/cache/esm2
original_sabdab_records: artifacts/data/sabdab2_v0.1.0/processed/records.csv
original_esm2_dir: artifacts/data/sabdab2_v0.1.0/embeddings/antigen/esm2
esm2_size: t33_650M
pretraining_dataset: asd
prototype:
  source_cohort: artifacts/experiments/asd_cath_transfer_v1/cohort
  audit_database: artifacts/data/asd/sabdab2_family_audit_v1/antigen_rows.sqlite
  max_train_records: 2000
  max_val_records: 200
  max_test_records: 200
  max_records_per_antigen: 10
  max_antigen_tokens: 512
  seed: 0
objectives:
  cross_entropy: {name: cross_entropy}
  focal: {name: focal, gamma: 2.0}
architectures:
  mango: antigen_chain_gpt2_v3
  cross_attention: antigen_chain_cross_attention_gpt2_v1
model:
  target_chains: [heavy, light]
  epochs: 1
  lr: 1.0e-4
  patience: 2
  grad_accum: 1
  loss_plot_interval: 250
  plot_sample_interval: 1
  seed: 0
  shuffle_train: true
