# Tiny, scientifically meaningless configuration for end-to-end plumbing tests.
# It reuses the normal SAbDab2 download but keeps one short structure from each
# of four source-train clusters and one source-test cluster. One train cluster
# becomes validation, leaving three train / one validation / one test record.
experiment:
  name: "mango_smoke"

processing:
  max_antigen_len: 250
  subset:
    enabled: true
    train_clusters: 4
    test_clusters: 1
    rows_per_cluster: 1
  val:
    strategy: "cluster"
    fraction: 0.25
    seed: 42
    cluster_column: "ab_ag_cluster"

model:
  epochs: 1
  patience: 1
  retrain: true

generation:
  max_targets: 1
  n_per_target: 2
  max_new_tokens: 30
  do_sample: true
  top_p: 0.9
  temperature: 1.0

analysis:
  cohort:
    n_per_target: 2
    seed: 13
  ab_likeness:
    ablang2:
      mode: "confidence"
